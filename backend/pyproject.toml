# Configuração das ferramentas de qualidade do backend.
# (As dependências ficam no requirements.txt, para manter a instalação simples.)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = erros básicos e código inválido, I = ordem dos imports,
# B = armadilhas comuns, UP = sintaxe moderna do Python.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite "import previsao" nos testes sem instalar o pacote.
pythonpath = ["."]
# Aviso interno do Prophet sobre um recurso do pandas que será removido — não é do nosso código.
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop"]
